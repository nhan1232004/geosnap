name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Web App (Vite + PWA)
        run: npm run build

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEOSNAP_4DD7A }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT" > sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/sa.json
            npx firebase-tools deploy --only hosting --project geosnap-4dd7a
          elif [ -n "$FIREBASE_TOKEN" ]; then
            npx firebase-tools deploy --only hosting --token "$FIREBASE_TOKEN" --project geosnap-4dd7a
          else
            echo "No deploy secret found. Please configure FIREBASE_SERVICE_ACCOUNT_GEOSNAP_4DD7A or FIREBASE_TOKEN in repository secrets."
          fi
