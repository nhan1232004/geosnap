name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Web App (Vite + PWA)
        run: npm run build

      - name: Deploy to Firebase Hosting (via Service Account)
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEOSNAP_4DD7A != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GEOSNAP_4DD7A }}'
          channelId: live
          projectId: geosnap-4dd7a

      - name: Deploy to Firebase Hosting (via Token fallback)
        if: ${{ secrets.FIREBASE_TOKEN != '' && secrets.FIREBASE_SERVICE_ACCOUNT_GEOSNAP_4DD7A == '' }}
        run: npx firebase-tools deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}" --project geosnap-4dd7a
